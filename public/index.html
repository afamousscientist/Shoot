<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoot!</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="icons/overrides.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand" id="brandHome" role="button" tabindex="0" aria-label="Back to lobby">
      <div class="glyph" role="presentation" aria-hidden="true"></div>
      <span class="brand-text">Shoot!</span>
    </div>
    <div class="profile" id="profileBar">
      <div class="profile-name" id="profileName">Guest</div>
      <button id="profileSave" class="ghost with-icon" data-icon="profile">Remember Profile</button>
    </div>
  </header>

  <main>
    <section id="lobby" class="panel">
      <div class="lobby-header">
        <h1>Welcome back</h1>
        <div class="actions">
          <button id="newProject" class="icon-button icon-only with-icon" data-icon="new" title="New project" aria-label="New project"></button>
          <div class="open-area">
            <select id="openProjectSelect"></select>
            <button id="openProject" class="icon-button icon-only with-icon" data-icon="open" title="Open project" aria-label="Open project"></button>
          </div>
        </div>
      </div>
      <div class="recent-list" id="recentList">
        <p class="muted">Loading recent projects…</p>
      </div>
      <footer class="lobby-footer">
        <div class="meta with-icon" data-icon="page">Network-ready workspace server</div>
        <button id="settingsButton" class="icon-button with-icon" data-icon="settings" title="Settings">Settings</button>
      </footer>
    </section>

    <section id="workspace" class="panel hidden">
      <div class="workspace-header">
        <div class="project-title" id="projectTitle">Untitled Project</div>
        <div class="workspace-actions">
          <button id="renameProject" class="icon-button icon-only with-icon" data-icon="rename" title="Rename project" aria-label="Rename project"></button>
          <button id="orientationToggle" class="icon-button icon-only with-icon" data-icon="orientation" title="Switch layout" aria-label="Switch layout"></button>
          <button id="saveProject" class="icon-button icon-only with-icon" data-icon="save" title="Save project" aria-label="Save project"></button>
        </div>
      </div>

      <div id="layout" class="layout horizontal">
        <aside class="rundown" id="rundownPanel">
          <div class="panel-header">
            <div class="with-icon" data-icon="page">Pages</div>
            <button id="addPage" class="icon-button icon-only with-icon" data-icon="new" title="Add page" aria-label="Add page"></button>
          </div>
          <table class="page-table" id="pageTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Type</th>
                <th>Synopsis</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </aside>

        <section class="editor" id="editorPanel">
          <div class="panel-header">
            <div class="with-icon" data-icon="page">Script Editor</div>
            <div class="muted">Double-click a page to load it, then type</div>
          </div>
          <div class="script-controls">
            <div class="script-meta" id="editorMeta">No page loaded</div>
            <div class="line-type-chips">
              <button class="chip" data-line-type="scene">Scene</button>
              <button class="chip" data-line-type="action">Action</button>
              <button class="chip" data-line-type="character">Character</button>
              <button class="chip" data-line-type="dialogue">Dialogue</button>
            </div>
          </div>
          <textarea id="scriptEditor" class="script-editor" aria-label="Screenplay text editor" spellcheck="false"></textarea>
        </section>
      </div>

      <div id="toolShelf" class="toolbar">
        <button id="collapseToolbar" class="ghost">Hide tools</button>
        <div class="tool-items">
          <label><input type="checkbox" data-plugin="breakdownHelper" checked /> Breakdown helper</label>
          <label><input type="checkbox" data-plugin="revisionTracker" checked /> Revision tracker</label>
          <label><input type="checkbox" data-plugin="referenceLinks" /> Reference links</label>
        </div>
      </div>
    </section>

    <section id="settings" class="panel hidden">
      <h2>Profile Settings</h2>
      <label>Display name
        <input id="profileInput" type="text" />
      </label>
      <div class="muted small">Settings are saved to your profile and follow you across the network.</div>
      <div class="settings-actions">
        <button id="saveSettings">Save Settings</button>
        <button id="closeSettings" class="ghost">Close</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
